repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        exclude: ^(doc/|scripts/cloud/)
      - id: ruff-format
        exclude: ^(doc/|scripts/cloud/)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
        exclude: \.md$
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: debug-statements

  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest (fast tests)
        entry: python -m pytest -m "not slow" -q --tb=short
        language: system
        pass_filenames: false
        stages: [pre-push]
