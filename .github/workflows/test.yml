name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    # Single Python version: matches the dev environment (3.12). Adding a
    # second version doubles CI time and the older Pythons aren't dev or
    # deploy targets. If we ever need forward-compat insurance, switch to
    # an upcoming release (3.13) rather than an older one.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenGL/EGL system libs (for aitviewer headless import)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglx-mesa0 libosmesa6

      - name: Install CI dependencies (CPU-only, headless)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
                      -r requirements-ci.txt
          python -m spacy download en_core_web_sm

      - name: Run fast tests (no GPU, no checkpoints, no aitviewer)
        run: |
          pytest tests/ -m "not slow and not gpu" --tb=short -q
        timeout-minutes: 15

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check src tests scripts
