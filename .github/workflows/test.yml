name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CI dependencies (CPU-only, no display required)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run fast tests (no GPU, no data files)
        run: |
          pytest tests/test_augmentation.py \
                 tests/test_physics_engine.py \
                 tests/test_body_model.py \
                 tests/test_rendering.py \
                 tests/test_model_generator.py \
                 -m "not slow" --tb=short -q
        timeout-minutes: 10
