name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache spaCy + huggingface + sentence_transformers models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch/sentence_transformers
            ~/.cache/spacy
          key: models-${{ runner.os }}-${{ hashFiles('.github/cache-manifest.txt') }}
          restore-keys: |
            models-${{ runner.os }}-

      - name: Install OpenGL/EGL system libs (for aitviewer headless import)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglx-mesa0 libosmesa6

      - name: Install dependencies via uv (CPU torch)
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system --extra-index-url https://download.pytorch.org/whl/cpu \
                         -e ".[dev,viewer]"
          python -m spacy download en_core_web_sm

      - name: Run fast tests (no GPU, no checkpoints, no aitviewer)
        run: |
          pytest tests/ -m "not slow and not gpu" --tb=short -q
        timeout-minutes: 15

      - name: Lint (ruff)
        run: ruff check src tests scripts
