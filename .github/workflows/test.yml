name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install OpenGL/EGL system libs (for aitviewer headless import)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglx-mesa0 libosmesa6

      - name: Install CI dependencies (CPU-only, headless)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
                      -r requirements-ci.txt
          python -m spacy download en_core_web_sm

      - name: Run fast tests (no GPU, no checkpoints, no aitviewer)
        run: |
          pytest tests/test_logic.py \
                 tests/test_modules.py \
                 tests/test_motion.py \
                 tests/test_pipeline.py \
                 tests/test_planner.py \
                 tests/test_style_rules.py \
                 tests/test_understanding.py \
                 -m "not slow" --tb=short -q
        timeout-minutes: 15

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check src tests scripts
