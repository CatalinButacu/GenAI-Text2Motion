#
# EDITING GUIDE
# -------------
# - `keywords` lists ONLY base/singular forms.
#   Plurals (balls, cubes, ...) are resolved automatically at runtime via
#   WordNet morphy. Keep irregular plurals or domain-specific terms explicit.
# - `default_shape` maps to the PyBullet collision shape: sphere | box | cylinder | humanoid
# - `default_size` units: metres.  sphere -> [radius], cylinder -> [radius, height].
# - `default_mass` in kg. 0.0 = static/immovable.
# - `can_be_grasped` whether a humanoid can pick this object up.
# - `mesh_prompt` optional text prompt for Shap-E / TripoSR mesh generation.
# - `category` must be one of: PRIMITIVE, FURNITURE, SPORTS, CONTAINER, HUMANOID

