# Object vocabulary for the M1 scene parser.
#
# EDITING GUIDE
# -------------
# - `keywords` lists ONLY base/singular forms.
#   Plurals (balls, cubes, ...) are resolved automatically at runtime via
#   WordNet morphy. Keep irregular plurals or domain-specific terms explicit.
# - `default_shape` maps to the PyBullet collision shape: sphere | box | cylinder | humanoid | urdf
#   When `default_shape: urdf`, set `urdf_path` to a path relative to pybullet_data root.
# - `default_size` units: metres.  sphere/cylinder first entry = radius; cylinder second = height.
# - `default_mass` in kg. 0.0 = static/immovable.
# - `can_be_grasped` whether a humanoid can pick this object up.
# - `mesh_prompt` optional text prompt for Shap-E / TripoSR mesh generation.
# - `urdf_path` path relative to pybullet_data root (only if default_shape: urdf).
# - `category` must be one of:
#     PRIMITIVE, FURNITURE, SPORTS, CONTAINER, HUMANOID,
#     KITCHEN, FOOD, TOOL, ELECTRONICS, VEHICLE

sphere:
  category: PRIMITIVE
  keywords: [sphere, ball, orb, globe]
  default_shape: sphere
  default_size: [0.1]
  default_mass: 0.5
  can_be_grasped: true
  mesh_prompt: null

