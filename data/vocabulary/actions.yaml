# Action vocabulary for the M1 scene parser.
#
# EDITING GUIDE
# -------------
# - `keywords` lists ONLY base/canonical forms.
#   Inflected forms (walking, walks, kicked, ...) are resolved automatically
#   at runtime via WordNet morphy lemmatisation.
# - Add domain-specific synonyms that WordNet may not know (e.g. "tip over").
# - `requires_target: true`  means the action always involves a second entity.
# - `motion_clip` is the canonical SSM query string used when raw_text is missing.
# - `category` must be one of: LOCOMOTION, MANIPULATION, INTERACTION,
#                               GESTURE, POSE, PHYSICS, EMOTION, ATHLETICS

#  Locomotion 
walk:
  category: LOCOMOTION
  keywords: [walk, stroll, move, wander, step]
  requires_target: false
  motion_clip: walk forward

run:
  category: LOCOMOTION
  keywords: [run, sprint, dash, rush, jog]
  requires_target: false
  motion_clip: run forward

