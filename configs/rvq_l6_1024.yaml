# RVQ hypertune: 6 levels x 1024 codes, code_dim 512. Bigger codebook per level (more capacity;
# does usage keep up?). Enc/dec width 512 / downsample 4 / 3 resblocks.
seed: 2026
device: cuda
data:
  track: hml3d263
  sources: [humanml3d]
  mirror_augment: true
  max_motion_len: 196
  min_motion_len: 40
paths:
  eval_matcher: data/official_evaluator/extracted/text_mot_match/model/finest.tar
  eval_stats_dir: data/eval_stats
  hml3d_out_dir: data/HumanML3D_official
  texts_dir: data/HumanML3D_official/texts
  checkpoints_dir: checkpoints
  outputs_dir: outputs
rvq_baseline:
  in_dim: 263
  width: 512
  downsample: 4
  n_resblocks: 3
  num_quantizers: 6
  codebook_size: 1024
  code_dim: 512
