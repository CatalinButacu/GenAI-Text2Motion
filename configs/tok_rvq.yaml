# Foundational strong-RVQ baseline re-run WITH manifest (6x512 = recon-FID 0.0382, trained Jun 4
# before run_log). `--tokenizer rvq` reads rvq_baseline (defaults: 6 levels x 512, EMA 0.99,
# dead-code reset, commitment 0.02, quant-dropout 0.2). Shares the conv enc/dec with FSQ -> the
# comparison isolates FSQ-vs-VQ at matched capacity.
seed: 2026
device: cuda
data:
  track: hml3d263
  sources: [humanml3d]
  mirror_augment: true
  max_motion_len: 196
  min_motion_len: 40
paths:
  eval_matcher: data/official_evaluator/extracted/text_mot_match/model/finest.tar
  eval_stats_dir: data/eval_stats
  hml3d_out_dir: data/HumanML3D_official
  texts_dir: data/HumanML3D_official/texts
  checkpoints_dir: checkpoints
  outputs_dir: outputs
