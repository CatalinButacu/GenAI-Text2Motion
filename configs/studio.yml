fit:
  model_dir: data/smplx_models
  num_betas: 10
  lr: 0.05
  w_smooth: 0.05
  w_reg: 0.0005
  stage1_iters: 150
  stage2_iters: 300
  progress_every: 10
  verbose_every: 100
  yaw_candidates_deg: [0.0, 90.0, 180.0, 270.0]

