# FSQ winner re-run, seeded: 6 groups x (8,5,5,5)=1000, latent 24-D. Target recon-FID ~0.0266.
# Repo-relative paths; ASCII-only (a BOM/encoding mishap broke the earlier copy).
seed: 2026
device: cuda
data:
  track: hml3d263
  sources: [humanml3d]
  mirror_augment: true
  max_motion_len: 196
  min_motion_len: 40
paths:
  eval_matcher: data/official_evaluator/extracted/text_mot_match/model/finest.tar
  eval_stats_dir: data/eval_stats
  hml3d_out_dir: data/HumanML3D_official
  texts_dir: data/HumanML3D_official/texts
  checkpoints_dir: checkpoints
  outputs_dir: outputs
tokenizer:
  in_dim: 263
  width: 512
  downsample: 4
  num_quantizers: 6
  fsq_levels: [8, 5, 5, 5]
  quantizer: grouped
  n_resblocks: 3
