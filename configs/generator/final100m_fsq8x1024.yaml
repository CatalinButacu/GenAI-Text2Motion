# Phase-3 FINAL twin run on the frozen FSQ 8x1024 tokenizer (recon-FID 0.0170, the best cell).
# = final100m.yaml geometry + the FSQ 8x1024 tokenizer section so the generator auto-configures to
# 8 codebooks x 1024 (num_codebooks=cfg.tokenizer.num_quantizers, codebook_size from the loaded ckpt).
# Both twins get the same +2 codebooks vs the 6-code default, so the transformer/Mamba param-match is
# preserved (both shift equally). seed 2026, bf16, fused mamba kernel (cloud).
seed: 2026
device: cuda

data:
  track: hml3d263
  sources: [humanml3d]
  mirror_augment: true
  max_motion_len: 196
  min_motion_len: 40

paths:
  eval_matcher: data/official_evaluator/extracted/text_mot_match/model/finest.tar
  eval_stats_dir: data/eval_stats
  hml3d_out_dir: data/HumanML3D_official
  texts_dir: data/HumanML3D_official/texts
  checkpoints_dir: checkpoints
  outputs_dir: outputs

tokenizer:
  in_dim: 263
  width: 512
  downsample: 4
  num_quantizers: 8
  fsq_levels: [8, 8, 4, 4]
  quantizer: grouped
  n_resblocks: 3

text_encoder:
  prefix_len: 16            # pooled + first 15 token states; must equal generator.text_prefix_len

generator:
  d_model: 768
  n_heads: 12
  n_layers: 12              # transformer twin
  mamba_n_layers: 23        # param-matched (+1.77%)
  dt_rank: 48               # d_model / 16
  max_seq_len: 96           # 16 prefix + 49 motion + END + headroom
  text_prefix_len: 16
  use_end_token: true
  use_kernel: false         # eager parallel-scan: the fused mamba-ssm kernel fails ABI-link on the current DLAMI torch 2.7/cu128 (undefined symbol c10_cuda_check_implementation); eager trains the identical weights, kernel only affects inference latency

train:
  amp: bf16                 # A10G bf16 autocast; optimizer/EMA stay fp32
