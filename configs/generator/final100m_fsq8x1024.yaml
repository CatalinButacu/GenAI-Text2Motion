seed: 2026
device: cuda

data:
  track: hml3d263
  sources: [humanml3d]
  mirror_augment: true
  max_motion_len: 196
  min_motion_len: 40

paths:
  eval_matcher: data/official_evaluator/extracted/text_mot_match/model/finest.tar
  eval_stats_dir: data/eval_stats
  hml3d_out_dir: data/HumanML3D_official
  texts_dir: data/HumanML3D_official/texts
  smplx_models: data/smplx_models
  checkpoints_dir: checkpoints
  outputs_dir: outputs

tokenizer:
  in_dim: 263
  width: 512
  downsample: 4
  num_quantizers: 8
  fsq_levels: [8, 8, 4, 4]
  quantizer: grouped
  n_resblocks: 3

text_encoder:
  prefix_len: 16

generator:
  d_model: 768
  n_heads: 12
  n_layers: 12
  mamba_n_layers: 23
  dt_rank: 48
  max_seq_len: 96
  text_prefix_len: 16
  use_end_token: true
  use_kernel: true

train:
  amp: bf16
