# Single source of truth for the MotionSSM headline cloud run.
# Both src/shared/constants.py defaults and the cloud startup.sh must
# stay in sync with these values; tests/test_config_drift.py enforces it.
#
# Smaller smoke configurations live in configs/smoke_*.yaml.

architecture:
  d_model: 384
  d_state: 64
  n_layers: 6
  motion_dim: 168
  text_embed_dim: 256
  max_motion_length: 200
  max_text_length: 64
  vocab_size: 10000
  bidirectional: false
  use_film: true
  arch: residual_k          # 'independent' or 'residual_k' (AR K-head)
  model_dropout: 0.1          # inter-layer dropout for regularisation
  use_sbert: true
  sbert_model: clip-ViT-B-32  # CLIP via sentence-transformers
  freeze_sbert: true
  gradient_checkpointing: true

rvq:
  rvq_latent_dim: 128
  rvq_n_codebooks: 6
  rvq_codebook_size: 512
  rvq_down_t: 4

training:
  batch_size: 64
  learning_rate: 3.0e-5
  weight_decay: 0.01
  num_epochs: 60
  warmup_steps: 500  # fresh training: ~7 epochs to reach peak LR (72 steps/epoch)
  grad_clip: 1.0
  # Length loss: normalised to [0,1] by /max_motion_length (raw MSE ~50 → ~0.001).
  # Weight 10.0 gives contribution ~0.01 vs CE ~4-5 (≈0.2% of total) -- secondary task.
  length_loss_weight: 10.0
  # Label smoothing (T2M-GPT style): prevents overconfidence on VQ-code targets.
  # 0.1 is standard for discrete token generation.
  label_smoothing: 0.1
  # Geometric losses: DISABLED for the SSM generation model (T2M-GPT paradigm).
  # Our SSM operates in token space -- geometry is already encoded in the RVQ codebook.
  # MDM uses geometric losses because it operates in raw motion space; that does not
  # apply here. Conflicting token-space CE vs motion-space L1 gradients hurt training.
  recon_loss_weight: 0.0
  velocity_loss_weight: 0.0
  root_height_loss_weight: 0.0
  cfg_dropout_prob: 0.1
  use_amp: true
  compile_model: false
  early_stop_patience: 30
  save_every: 10
  keep_last_checkpoints: 5
  seed: 42
  single_gpu: false
  # Pose-prefix curriculum: NOT WIRED IN THE CURRENT TRAINER LOOP.
  # Keep 0.0 until the trainer actually consumes seed_latent during training.
  # The model API (TextToMotionSSM.forward(seed_latent=...)) exists and is
  # covered by tests/test_seed_latent.py, but no batch in run_train_epoch
  # currently sets it. Setting >0.0 will fail loudly in train_motion_ssm.py.
  pose_prefix_prob: 0.0
  # Causal RVQ decoder (decision #10). Must MATCH the tokenizer's training
  # flag -- if the RVQ checkpoint was trained with --causal-decoder, this
  # must also be true at SSM training time, otherwise the latent → motion
  # decode signal won't align with what the streaming inference path uses.
  causal_decoder: true
