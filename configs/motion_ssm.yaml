# Single source of truth for the MotionSSM headline cloud run.
# Both src/shared/constants.py defaults and the cloud startup.sh must
# stay in sync with these values; tests/test_config_drift.py enforces it.
#
# Smaller smoke configurations live in configs/smoke_*.yaml.

architecture:
  d_model: 384
  d_state: 64
  n_layers: 6
  motion_dim: 168
  text_embed_dim: 256
  max_motion_length: 200
  max_text_length: 64
  vocab_size: 10000
  bidirectional: true
  use_film: true
  arch: independent           # 'independent' or 'residual_k' (AR K-head)
  use_sbert: true
  sbert_model: clip-ViT-B-32  # CLIP via sentence-transformers
  freeze_sbert: true
  gradient_checkpointing: true

rvq:
  rvq_latent_dim: 128
  rvq_n_codebooks: 6
  rvq_codebook_size: 512
  rvq_down_t: 4

training:
  batch_size: 64
  learning_rate: 1.0e-4
  weight_decay: 0.01
  num_epochs: 30
  warmup_steps: 1000
  grad_clip: 1.0
  length_loss_weight: 0.1
  cfg_dropout_prob: 0.1
  use_amp: true
  compile_model: false
  early_stop_patience: 30
  save_every: 10
  keep_last_checkpoints: 5
  seed: 42
  single_gpu: false
