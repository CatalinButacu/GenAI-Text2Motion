name: text2motion

x-environment: &environment
  TEXT2MOTION_DATASET_DIR: ${TEXT2MOTION_DATASET_DIR:-/app/data/HumanML3D_official}
  TEXT2MOTION_EVAL_MATCHER: ${TEXT2MOTION_EVAL_MATCHER:-/app/data/official_evaluator/extracted/t2m/text_mot_match/model/finest.tar}
  TEXT2MOTION_EVAL_STATS_DIR: ${TEXT2MOTION_EVAL_STATS_DIR:-/app/data/eval_stats}
  TEXT2MOTION_TEXTS_DIR: ${TEXT2MOTION_TEXTS_DIR:-/app/data/HumanML3D_official/texts}
  TEXT2MOTION_SMPLX_MODELS: ${TEXT2MOTION_SMPLX_MODELS:-/app/data/smplx_models}
  TEXT2MOTION_CHECKPOINTS_DIR: /app/checkpoints
  TEXT2MOTION_OUTPUTS_DIR: /app/outputs
  TEXT2MOTION_LOGS_DIR: /app/logs
  TEXT2MOTION_CACHE_DIR: /var/cache/text2motion
  TEXT2MOTION_SERVICE_PORT: ${TEXT2MOTION_SERVICE_PORT:-8765}
  TEXT2MOTION_IDLE_SECONDS: ${TEXT2MOTION_IDLE_SECONDS:-600}
  HF_HOME: /var/cache/text2motion/huggingface
  TORCH_HOME: /var/cache/text2motion/torch

x-volumes: &volumes
  - ${TEXT2MOTION_HOST_DATA:-./data}:/app/data
  - ${TEXT2MOTION_HOST_CHECKPOINTS:-./checkpoints}:/app/checkpoints
  - ${TEXT2MOTION_HOST_OUTPUTS:-./outputs}:/app/outputs
  - ${TEXT2MOTION_HOST_LOGS:-./logs}:/app/logs
  - ${TEXT2MOTION_HOST_CACHE:-./.docker-cache}:/var/cache/text2motion

services:
  test:
    profiles: [test]
    image: ${TEXT2MOTION_DEV_IMAGE:-text2motion:dev}
    build:
      context: .
      target: development
    working_dir: /workspace
    environment:
      <<: *environment
      PYTHONPATH: /workspace/src
    volumes:
      - .:/workspace
      - ${TEXT2MOTION_HOST_CACHE:-./.docker-cache}:/var/cache/text2motion
    mem_limit: ${TEXT2MOTION_MEMORY_LIMIT:-8g}
    memswap_limit: ${TEXT2MOTION_MEMORY_LIMIT:-8g}
    shm_size: ${TEXT2MOTION_SHM_SIZE:-1g}

  service:
    profiles: [service]
    image: ${TEXT2MOTION_IMAGE:-text2motion:local}
    build:
      context: .
      target: runtime
    init: true
    restart: unless-stopped
    gpus: all
    command:
      - serve
      - --config
      - ${TEXT2MOTION_CONFIG:-configs/default.yaml}
      - --backbone
      - ${TEXT2MOTION_BACKBONE:-transformer}
      - --ckpt
      - ${TEXT2MOTION_GENERATOR_CHECKPOINT:-/app/checkpoints/generator/generator_transformer_bs8_enc_last.pt}
      - --tokenizer_ckpt
      - ${TEXT2MOTION_TOKENIZER_CHECKPOINT:-/app/checkpoints/tokenizer/fsq_g8_v1024.pt}
    environment:
      <<: *environment
      TEXT2MOTION_BIND_HOST: 0.0.0.0
    ports:
      - ${TEXT2MOTION_SERVICE_PORT:-8765}:${TEXT2MOTION_SERVICE_PORT:-8765}
    volumes: *volumes
    mem_limit: ${TEXT2MOTION_MEMORY_LIMIT:-8g}
    memswap_limit: ${TEXT2MOTION_MEMORY_LIMIT:-8g}
    shm_size: ${TEXT2MOTION_SHM_SIZE:-1g}
    healthcheck:
      test: [CMD, text2motion, health, --config, configs/default.yaml, --host, 127.0.0.1]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    stop_grace_period: 30s

  job:
    profiles: [job]
    image: ${TEXT2MOTION_IMAGE:-text2motion:local}
    build:
      context: .
      target: runtime
    init: true
    gpus: all
    command: [--help]
    environment: *environment
    volumes: *volumes
    mem_limit: ${TEXT2MOTION_MEMORY_LIMIT:-8g}
    memswap_limit: ${TEXT2MOTION_MEMORY_LIMIT:-8g}
    shm_size: ${TEXT2MOTION_SHM_SIZE:-1g}
    stop_grace_period: 2m
