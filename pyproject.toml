[project]
name = "physics-constrained-video-gen"
version = "0.1.0"
requires-python = ">=3.10"

[tool.pytest.ini_options]
addopts = "-s"
log_cli = true
log_cli_level = "INFO"
markers = [
  "slow: marks tests as slow (deselect with '-m not slow') -- requires checkpoints / ffmpeg / aitviewer",
  "gpu: marks tests that require a CUDA device (deselect with '-m not gpu')",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["doc/", "scripts/cloud/", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E402", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
